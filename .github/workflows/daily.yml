name: Daily Playwright Run

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test tests/sdetcampaign.spec.js --reporter=line

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Send Gmail report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Daily Report - ${{ github.run_number }} - ${{ job.status }}
          to: ${{ secrets.GMAIL_TO }}
          from: GitHub Actions <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Hello,

            The daily Playwright run is complete.

            Status: ${{ job.status }}
            Workflow: ${{ github.workflow }}
            Run number: ${{ github.run_number }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

            Please check the attached HTML report and GitHub Actions logs for details.
          attachments: playwright-report/index.html
          secure: true
